name: ai-notes-maker
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment: {POSTGRES_DB: "${POSTGRES_DB:-studyforge}", POSTGRES_USER: "${POSTGRES_USER:-studyforge}", POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"], interval: 5s, timeout: 5s, retries: 20}
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: [redis_data:/data]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 20}
  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address :9001
    environment: {MINIO_ROOT_USER: "${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}", MINIO_ROOT_PASSWORD: "${S3_SECRET_KEY:?Set S3_SECRET_KEY}"}
    volumes: [object_data:/data]
    healthcheck: {test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"], interval: 10s, timeout: 5s, retries: 20}
  clamav:
    image: clamav/clamav:1.4
    volumes: [clamav_data:/var/lib/clamav]
    healthcheck: {test: ["CMD-SHELL", "echo PING | nc localhost 3310 | grep PONG"], interval: 20s, timeout: 5s, retries: 30, start_period: 60s}
  migrate:
    build: {context: ., dockerfile: backend/Dockerfile}
    env_file: .env
    command: ["alembic", "-c", "/app/alembic.ini", "upgrade", "head"]
    depends_on: {postgres: {condition: service_healthy}}
  backend:
    build: {context: ., dockerfile: backend/Dockerfile}
    env_file: .env
    ports: ["8000:8000"]
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_healthy}, clamav: {condition: service_healthy}, minio: {condition: service_healthy}, migrate: {condition: service_completed_successfully}}
    healthcheck: {test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/live')"], interval: 20s, timeout: 5s, retries: 5}
  worker:
    build: {context: ., dockerfile: backend/Dockerfile}
    env_file: .env
    command: ["celery", "-A", "app.workers.celery_app.celery", "worker", "--loglevel=INFO", "--concurrency=2"]
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_healthy}, migrate: {condition: service_completed_successfully}}
volumes: {postgres_data: {}, redis_data: {}, object_data: {}, clamav_data: {}}
