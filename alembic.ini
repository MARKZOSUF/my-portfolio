# Alembic configuration for StudyForge.
#
# The revision scripts live in database/migrations/versions and import helpers
# via `from database.migrations.helpers import ...`, so Alembic is always run
# from the repository root (prepend_sys_path = . makes that import work).
#
# The database URL is intentionally NOT stored here. env.py reads DATABASE_URL
# from the environment so no credential is ever committed.
[alembic]
script_location = database/migrations
prepend_sys_path = .
version_path_separator = os

# Revision filenames: 0001_initial_initial_users_auth.py and friends. The slug
# is already encoded in the existing filenames, so keep the same shape.
file_template = %%(rev)s_%%(slug)s

[post_write_hooks]
# No automatic formatting; revisions are reviewed by hand.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %%(levelname)-5.5s [%%(name)s] %%(message)s
datefmt = %%H:%%M:%%S
